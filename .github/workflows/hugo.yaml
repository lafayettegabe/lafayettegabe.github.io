name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
      HUGO_ENV: production
      TZ: America/Los_Angeles
      GITALK_CLIENT_ID: ${{ secrets.GITALK_CLIENT_ID }}
      GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}

    steps:
      # ========== SETUP ==========
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Sass
        run: sudo snap install dart-sass

      # ========== CONFIGURATION ==========
      - name: Inject Secrets into Config
        run: |
          sed -i "s/GITALK_CLIENT_ID/${GITALK_CLIENT_ID}/g" hugo.toml
          sed -i "s/GITALK_CLIENT_SECRET/${GITALK_CLIENT_SECRET}/g" hugo.toml

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # ========== DEPENDENCIES ==========
      - name: Install Node.js modules
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          fi

      # ========== CACHE MANAGEMENT ==========
      - name: Restore build cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # ========== BUILD ==========
      - name: Build site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Save build cache
        uses: actions/cache/save@v4
        id: cache-save
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # ========== ARTIFACT ==========
      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy Site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
